# Toolchain versions pinned for reproducible builds across devs and CI.
# Run `mise install` (or `mise i`) on a fresh checkout to install everything.

[tools]
go      = "1.27.3"
buf     = "1.65.0"
task    = "3.48.0"
"go:golang.org/x/vuln/cmd/govulncheck" = "1.9.0"

# protoc-gen-go is installed into the module's tool dependencies via
# `task tools` (go install), so its version is pinned by go.mod rather
# than mise. buf drives generation; see Taskfile `generate`.
