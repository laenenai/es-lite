# es-lited — zero-knowledge eventstore NATS service (ADR 0009).
# A stateless service over shared Postgres; scale horizontally. See
# docs/deploy/README.md. Replace image, secretRefs, and OpenBao roles.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: es-lited
  labels: { app: es-lited }
spec:
  replicas: 3
  selector:
    matchLabels: { app: es-lited }
  template:
    metadata:
      labels: { app: es-lited }
      annotations:
        # --- OpenBao/Vault Agent: inject dynamic infra secrets (no static
        # creds in the pod). Uncomment and set your roles/mounts.
        # vault.hashicorp.com/agent-inject: "true"
        # vault.hashicorp.com/role: "es-lited"
        # Dynamic Postgres creds -> render PG_DSN:
        # vault.hashicorp.com/agent-inject-secret-pg: "database/creds/es-lited"
        # vault.hashicorp.com/agent-inject-template-pg: |
        #   {{- with secret "database/creds/es-lited" -}}
        #   export PG_DSN="postgres://{{ .Data.username }}:{{ .Data.password }}@pg:5432/eslite?sslmode=verify-full"
        #   {{- end -}}
        # NATS creds + mTLS (PKI) injected similarly.
        {}
    spec:
      securityContext:
        runAsNonRoot: true
        # 65532 = distroless 'nonroot' UID. The image sets USER by name, which
        # kubelet cannot verify against runAsNonRoot without a numeric UID
        # (else: CreateContainerConfigError).
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile: { type: RuntimeDefault }
      # Run migrations once, before any replica starts (ADR 0010) — so app
      # replicas never race on DDL at boot. Same image, /es-migrate entrypoint.
      initContainers:
        - name: migrate
          image: ghcr.io/laenenai/es-lited:latest # replace (same tag as below)
          command: ["/es-migrate"]
          env:
            - { name: BACKEND, value: postgres }
            - name: PG_DSN
              valueFrom:
                secretKeyRef: { name: es-lited-pg, key: dsn }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
      containers:
        - name: es-lited
          image: ghcr.io/laenenai/es-lited:latest # replace
          imagePullPolicy: IfNotPresent
          env:
            - { name: BACKEND, value: postgres }
            - { name: AUTO_MIGRATE, value: "false" } # migrations run in the init container
            - { name: NATS_URL, value: "nats://nats.svc:4222" }
            # <prefix>.<ws>.<method>; region in the prefix per cell (ADR 0005). One
            # es-lited per region on its own prefix — data residency is a deploy.
            - { name: NATS_SUBJECT_PREFIX, value: "svc.eslite.eu" }
            - { name: HEALTH_ADDR, value: ":8080" }
            # RELAY=true folds the delivery relay into every replica under NATS KV
            # leader election: exactly one replica drains Postgres -> JetStream at
            # a time, failing over automatically — so no separate es-relayd
            # Deployment (relay.yaml) is needed. Election key is per-prefix, so
            # each region elects its own relay leader.
            - { name: RELAY, value: "true" }
            - { name: ES_STREAM, value: "ES_EVENTS" }
            # false = the stream is provisioned by ops (R3, bounded MaxAge) — the
            # relay must NOT auto-create it (that defaults to R1 / infinite
            # retention). Flip to "true" only for dev/single-node convenience.
            - { name: ES_ENSURE_STREAM, value: "false" }
            # Observability: OTLP metrics + traces -> OpenObserve (inert if unset).
            - { name: OTEL_EXPORTER_OTLP_ENDPOINT, value: "http://openobserve:5081" }
            # - { name: OTEL_EXPORTER_OTLP_HEADERS, value: "..." } # auth via a Secret in prod
            # PG_DSN: prefer the OpenBao Agent template above. Fallback to a
            # Secret for non-OpenBao environments:
            - name: PG_DSN
              valueFrom:
                secretKeyRef: { name: es-lited-pg, key: dsn }
          ports:
            - { name: health, containerPort: 8080 }
          livenessProbe:
            httpGet: { path: /healthz, port: health }
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /healthz, port: health }
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            requests: { cpu: "100m", memory: "128Mi" }
            limits: { cpu: "1", memory: "512Mi" }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
---
# Optional Service — es-lited is reached over NATS (no inbound traffic), so
# this only exposes the health/metrics port for scraping if desired.
apiVersion: v1
kind: Service
metadata:
  name: es-lited
  labels: { app: es-lited }
spec:
  selector: { app: es-lited }
  ports:
    - { name: health, port: 8080, targetPort: health }
