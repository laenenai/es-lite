name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: build · vet · unit · race · vuln · codegen-drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # buf breaking needs main history
      - uses: jdx/mise-action@v2 # installs go/buf/task/govulncheck pinned in .mise.toml
      - run: task generate:check # buf lint + regenerate, fail on drift
      - run: task lint:proto   # buf lint + breaking against main
      - run: task vet
      - run: task test           # unit tests (integration suites skip without env)
      - run: task test:race
      - run: task vuln

  # Publish the es/v1 options module to the BSR under the `main` label so
  # consumers can pin a commit before a release tag exists (ADR 0033).
  # Skipped on PRs and forks (no BUF_TOKEN there).
  bsr:
    name: buf push (main)
    runs-on: ubuntu-latest
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@v2
      - uses: bufbuild/buf-action@v1
        with:
          token: ${{ secrets.BUF_TOKEN }}
          setup_only: true
      - run: task buf:push LABEL=main

  integration:
    name: integration (postgres · nats · pipeline · snapshots)
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@v2
      # Each target spins up its own throwaway container (Docker is preinstalled
      # on the runner) and tears it down via `defer`.
      - run: task test:pg
      - run: task test:nats
      - run: task test:pipeline
      - run: task test:snapshots
