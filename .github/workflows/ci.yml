name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: build · vet · unit · race · vuln · codegen-drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # buf breaking needs main history
      - uses: jdx/mise-action@v2 # installs go/buf/task/govulncheck pinned in .mise.toml
      - run: task generate:check # buf lint + regenerate, fail on drift
      - run: task lint:proto   # buf lint + breaking against main
      - run: task vet
      - run: task test           # unit tests (integration suites skip without env)
      - run: task test:race
      - run: task vuln

  # Export the es/v1 options module so consumers can use it without the BSR
  # while BSR publishing is blocked on BUF_TOKEN (ADR 0033).
  proto-export:
    name: buf export (main)
    runs-on: ubuntu-latest
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@v2
      - run: task buf:export VERSION=main
      - uses: actions/upload-artifact@v4
        with:
          name: es-lite-proto-main
          path: dist/es-lite-proto-main.tar.gz
          if-no-files-found: error

  integration:
    name: integration (postgres · nats · pipeline · snapshots)
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@v2
      # Each target spins up its own throwaway container (Docker is preinstalled
      # on the runner) and tears it down via `defer`.
      - run: task test:pg
      - run: task test:nats
      - run: task test:pipeline
      - run: task test:snapshots
