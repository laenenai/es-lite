name: Release

# Publish the es-lited image ONLY on version tags — never per-commit/PR — so
# GHCR gets one image per release, not per build. Retention (untagged + old
# versions) is handled by ghcr-cleanup.yml.
on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

env:
  GOPRIVATE: github.com/laenenai/*
  IMAGE: ghcr.io/laenenai/es-lited

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }} # packages:write
      - name: Tags & labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          # Immutable semver tags; `latest` moves but each digest stays
          # referenced by its semver tag, so no orphans are created.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          flavor: latest=true
      - name: Build & push (multi-arch)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          # BuildKit secret for the private natskit module (never in a layer).
          secrets: |
            go_modules_token=${{ secrets.GO_MODULES_TOKEN }}
