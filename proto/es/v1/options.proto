syntax = "proto3";

package es.v1;

import "google/protobuf/descriptor.proto";

option go_package = "github.com/laenenai/es-lite/gen/es/v1;esv1";

// es-lite's framework options. The parent framework's options.proto carries
// a dozen options (data classification, subject fields, projection specs);
// lite carries only what its own runtime and code generator act on. Message
// options: the sum-type marker and the per-event schema version. Field
// options: the command-time marker (ADR 0032).
//
// Extension numbers are allocated from es-lite's 5xxxx range and are never
// renumbered (buf breaking, FILE rule):
//   50001–50002  message options (schema_version, sum_type)
//   50023        field option    (decided_at, ADR 0032)
extend google.protobuf.MessageOptions {
  // Marks this message as a sum-type container: a message holding exactly
  // one `oneof` whose variants form a sealed Go interface. The value is
  // the interface name (by convention "Command" or "Event").
  //
  // protoc-gen-es-lite emits, into the message's own package:
  //   - `type <Name> interface { is<Name>() }`  (sealed)
  //   - a marker method on each variant message
  //   - `type <Name>Codec struct{}` implementing es.Codec[<Name>],
  //     marshalling each variant as canonical proto bytes tagged with
  //     its full proto type name.
  string sum_type = 50002;

  // The event's schema version — a monotonic uint32 (default 1), set on an
  // individual event variant message. Bump it when the event's meaning
  // changes in a way proto's wire compatibility cannot detect (units shift,
  // enum semantics change, a field is reinterpreted). The generated codec
  // stamps this onto every EncodedEvent as its upcaster dispatch key; it
  // rides the wire in the envelope and the Es-Schema-Version NATS header.
  //
  //   message Incremented {
  //     option (es.v1.schema_version) = 2;
  //     int64 by_millicents = 1; // was by_cents in v1
  //   }
  uint32 schema_version = 50001;
}

extend google.protobuf.FieldOptions {
  // Marks the google.protobuf.Timestamp field of a command variant that
  // carries the command's decision time (ADR 0032). protoc-gen-es-lite
  // emits `DecisionTime() time.Time` on the variant (es.DecidedAt — the
  // method is not called DecidedAt because protoc-gen-go already emits a
  // struct field of that name for a field called decided_at), and aggregate.Runtime
  // sources Envelope.OccurredAt from it: a zero Meta.OccurredAt is filled
  // from the command, a conflicting non-zero one is rejected with
  // es.ErrDecidedAtMismatch, and a tagged-but-unset field is rejected with
  // es.ErrDecidedAtMissing. Generation fails when the field is not a
  // Timestamp or its message is not a variant of a "Command" sum type.
  //
  //   message AddMember {
  //     google.protobuf.Timestamp decided_at = 4 [(es.v1.decided_at) = true];
  //   }
  bool decided_at = 50023;
}
