# Task runner for es-lite. Toolchain versions are pinned in .mise.toml;
# run `mise install` first. See docs/adr for the design.
version: "3"

env:
  # es-lite is a standalone module; isolate it from any parent go.work.
  GOWORK: "off"

# Codegen plugins are installed/built into $(go env GOPATH)/bin and made
# discoverable to buf by prepending that dir to PATH *in the shell command*
# (plain $PATH expansion — Task's env-template PATH does not resolve
# reliably across environments, e.g. CI runners).

tasks:
  default:
    desc: List available tasks.
    cmds:
      - task --list
    silent: true

  tools:
    desc: Install/build the code-generation plugins into $(go env GOPATH)/bin.
    cmds:
      - go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.11
      # protoc-gen-connect-go at the version the cmdsvc nested module pins.
      # An unversioned install now resolves the latest connect/v2 and makes
      # generate:check drift, so ask cmdsvc's module graph for the exact pin.
      - cd cmdsvc && go install "connectrpc.com/connect/cmd/protoc-gen-connect-go@$(go list -m connectrpc.com/connect | awk '{print $2}')"
      - go build -o "$(go env GOPATH)/bin/protoc-gen-es-lite" ./cmd/protoc-gen-es-lite

  generate:
    desc: Generate proto Go + es-lite sum-types/codecs/projectors/services (buf).
    deps: [tools]
    cmds:
      - buf lint
      # Each workspace module is generated as its own input: core options and
      # the counter fixtures into gen/; the ADR 0031 service fixture into the
      # cmdsvc nested module (its generated code imports connect-go).
      - PATH="$(go env GOPATH)/bin:$PATH" buf generate proto
      - PATH="$(go env GOPATH)/bin:$PATH" buf generate examples/counter/proto
      - PATH="$(go env GOPATH)/bin:$PATH" buf generate cmdsvc/example/proto --template cmdsvc/buf.gen.yaml

  generate:bootstrap:
    desc: >
      Cold-start generation for a clean checkout where gen/es/v1 does not
      yet exist (protoc-gen-es-lite imports it). Generates the framework
      options with protoc-gen-go only, builds the plugin, then runs the
      full generate.
    cmds:
      - go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.11
      - PATH="$(go env GOPATH)/bin:$PATH" buf generate proto --template buf.gen.bootstrap.yaml
      - go build -o "$(go env GOPATH)/bin/protoc-gen-es-lite" ./cmd/protoc-gen-es-lite
      - task: generate

  generate:check:
    desc: Fail if generated code is out of date, including untracked files (CI gate).
    deps: [generate]
    cmds:
      - test -z "$(git status --porcelain -- gen/ cmdsvc/example/gen/)" || (echo "generated code is stale; run 'task generate'" && git status --porcelain -- gen/ cmdsvc/example/gen/ && exit 1)

  build:
    desc: Build every package (core module + the cmdsvc nested module).
    cmds:
      - go build ./...
      - cd cmdsvc && go build ./...

  test:
    desc: Run the unit test suite (integration tests skip without live services).
    cmds:
      - go test ./...
      - cd cmdsvc && go test ./...

  test:race:
    desc: Run the unit suite under the race detector with shuffled order.
    cmds:
      - go test -race -count=1 -shuffle=on ./...
      - cd cmdsvc && go test -race -count=1 -shuffle=on ./...

  vuln:
    desc: Run govulncheck against the module and the cmdsvc nested module (CI gate).
    cmds:
      - govulncheck ./...
      - cd cmdsvc && govulncheck ./...

  test:pg:
    desc: Postgres integration tests against a throwaway Docker Postgres.
    cmds:
      - docker rm -f es-lite-pg 2>/dev/null || true
      - docker run -d --rm --name es-lite-pg -p 5433:5432 -e POSTGRES_PASSWORD=pw -e POSTGRES_DB=eslite postgres:17
      - until docker exec es-lite-pg pg_isready -U postgres >/dev/null 2>&1; do sleep 1; done
      - defer: docker rm -f es-lite-pg
      - PG_DSN='postgres://postgres:pw@127.0.0.1:5433/eslite?sslmode=disable' go test -count=1 ./postgres/...

  test:feedgate:
    desc: >
      Feed gate (Phase 1 / Gate 0): chaos no-loss, page-query plan and fleet
      scenarios against a throwaway Docker Postgres. Too slow for the PR path;
      CI runs it nightly. Benchmarks are run separately (-bench) for the
      write-path baseline.
    cmds:
      - docker rm -f es-lite-pg 2>/dev/null || true
      - docker run -d --rm --name es-lite-pg -p 5433:5432 -e POSTGRES_PASSWORD=pw -e POSTGRES_DB=eslite postgres:17
      - until docker exec es-lite-pg pg_isready -U postgres >/dev/null 2>&1; do sleep 1; done
      - defer: docker rm -f es-lite-pg
      - PG_DSN='postgres://postgres:pw@127.0.0.1:5433/eslite?sslmode=disable' go test -race -shuffle=on -tags feedgate -count=1 -timeout 45m ./postgres/ -run TestFeedGate

  vet:
    desc: go vet across the module and the cmdsvc nested module.
    cmds:
      - go vet ./...
      - cd cmdsvc && go vet ./...

  lint:proto:
    desc: buf lint + breaking-change check against main, per module.
    cmds:
      - buf lint
      # Compare each module against its own path on main. A workspace-wide
      # `--against` cannot match modules once `proto` carries a BSR name
      # (ADR 0033): it reported the unchanged counter fixture as deleted.
      # cmdsvc/example/proto is new on this branch and has no baseline yet.
      - buf breaking proto --against '.git#ref=origin/main,subdir=proto'
      - buf breaking examples/counter/proto --against '.git#ref=origin/main,subdir=examples/counter/proto'

  buf:export:
    desc: >
      Export the es/v1 options module as dist/es-lite-proto-<VERSION>.tar.gz.
      Used until BSR publishing is configured (ADR 0033); release.yml attaches
      the tag export to the GitHub release. VERSION defaults to "dev".
    cmds:
      - rm -rf dist/es-lite-proto
      - mkdir -p dist/es-lite-proto
      - buf export proto -o dist/es-lite-proto
      - cp LICENSE dist/es-lite-proto/LICENSE
      - tar -C dist -czf "dist/es-lite-proto-{{.VERSION | default `dev`}}.tar.gz" es-lite-proto

  buf:push:
    desc: >
      Push the es/v1 options module to the BSR as buf.build/laenenai/es-lite
      (ADR 0033). Needs a BUF_TOKEN with write access (`buf registry login`).
      LABEL defaults to the current git ref name; CI pushes `main` on every
      main build and the tag name on release. Lint + breaking gate the push.
    cmds:
      - buf lint proto
      - buf breaking proto --against '.git#ref=origin/main,subdir=proto'
      - buf push proto --label "{{.LABEL | default "$(git rev-parse --abbrev-ref HEAD)"}}"

  tidy:
    desc: Tidy go.mod/go.sum (core + cmdsvc).
    cmds:
      - go mod tidy
      - cd cmdsvc && go mod tidy

