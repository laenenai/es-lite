# Task runner for es-lite. Toolchain versions are pinned in .mise.toml;
# run `mise install` first. See docs/adr for the design.
version: "3"

env:
  # es-lite is a standalone module; isolate it from any parent go.work.
  GOWORK: "off"

# Codegen plugins are installed/built into $(go env GOPATH)/bin and made
# discoverable to buf by prepending that dir to PATH *in the shell command*
# (plain $PATH expansion — Task's env-template PATH does not resolve
# reliably across environments, e.g. CI runners).

tasks:
  default:
    desc: List available tasks.
    cmds:
      - task --list
    silent: true

  tools:
    desc: Install/build the code-generation plugins into $(go env GOPATH)/bin.
    cmds:
      - go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.11
      - go build -o "$(go env GOPATH)/bin/protoc-gen-es-lite" ./cmd/protoc-gen-es-lite

  generate:
    desc: Generate proto Go + es-lite sum-types/codecs (buf).
    deps: [tools]
    cmds:
      - buf lint
      - PATH="$(go env GOPATH)/bin:$PATH" buf generate

  generate:bootstrap:
    desc: >
      Cold-start generation for a clean checkout where gen/es/v1 does not
      yet exist (protoc-gen-es-lite imports it). Generates the framework
      options with protoc-gen-go only, builds the plugin, then runs the
      full generate.
    cmds:
      - go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.11
      - PATH="$(go env GOPATH)/bin:$PATH" buf generate --template buf.gen.bootstrap.yaml
      - go build -o "$(go env GOPATH)/bin/protoc-gen-es-lite" ./cmd/protoc-gen-es-lite
      - PATH="$(go env GOPATH)/bin:$PATH" buf generate

  generate:check:
    desc: Fail if generated code is out of date, including untracked files (CI gate).
    deps: [generate]
    cmds:
      - test -z "$(git status --porcelain -- gen/)" || (echo "generated code is stale; run 'task generate'" && git status --porcelain -- gen/ && exit 1)

  build:
    desc: Build every package.
    cmds:
      - go build ./...

  test:
    desc: Run the unit test suite (integration tests skip without live services).
    cmds:
      - go test ./...

  test:race:
    desc: Run the unit suite under the race detector with shuffled order.
    cmds:
      - go test -race -count=1 -shuffle=on ./...

  vuln:
    desc: Run govulncheck against the module (CI gate).
    cmds:
      - govulncheck ./...

  test:pg:
    desc: Postgres integration tests against a throwaway Docker Postgres.
    cmds:
      - docker rm -f es-lite-pg 2>/dev/null || true
      - docker run -d --rm --name es-lite-pg -p 5433:5432 -e POSTGRES_PASSWORD=pw -e POSTGRES_DB=eslite postgres:17
      - until docker exec es-lite-pg pg_isready -U postgres >/dev/null 2>&1; do sleep 1; done
      - defer: docker rm -f es-lite-pg
      - PG_DSN='postgres://postgres:pw@127.0.0.1:5433/eslite?sslmode=disable' go test -count=1 ./postgres/...

  test:nats:
    desc: NATS/JetStream integration test against a throwaway Docker NATS.
    cmds:
      - docker rm -f es-lite-nats 2>/dev/null || true
      - docker run -d --rm --name es-lite-nats -p 4222:4222 nats:2.10 -js
      - until nc -z 127.0.0.1 4222 2>/dev/null; do sleep 1; done
      - defer: docker rm -f es-lite-nats
      - NATS_URL=nats://127.0.0.1:4222 go test -count=1 ./natsjs/... ./leader/... ./natsstore/...

  test:pipeline:
    desc: Full-pipeline integration test (Postgres + NATS) end to end.
    cmds:
      - docker rm -f es-lite-pg es-lite-nats 2>/dev/null || true
      - docker run -d --rm --name es-lite-pg -p 5433:5432 -e POSTGRES_PASSWORD=pw -e POSTGRES_DB=eslite postgres:17
      - docker run -d --rm --name es-lite-nats -p 4222:4222 nats:2.10 -js
      - until docker exec es-lite-pg pg_isready -U postgres >/dev/null 2>&1 && nc -z 127.0.0.1 4222 2>/dev/null; do sleep 1; done
      - defer: docker rm -f es-lite-pg es-lite-nats
      - PG_DSN='postgres://postgres:pw@127.0.0.1:5433/eslite?sslmode=disable' NATS_URL=nats://127.0.0.1:4222 go test -count=1 ./examples/pipeline/...
      # Chain audit smoke (ADR 0029): every stream the pipeline wrote verifies.
      - BACKEND=postgres PG_DSN='postgres://postgres:pw@127.0.0.1:5433/eslite?sslmode=disable' go run ./cmd/es-verify all --strict

  test:snapshots:
    desc: Snapshot-cache integration test (NATS KV).
    cmds:
      - docker rm -f es-lite-nats 2>/dev/null || true
      - docker run -d --rm --name es-lite-nats -p 4222:4222 nats:2.10 -js
      - until nc -z 127.0.0.1 4222 2>/dev/null; do sleep 1; done
      - defer: docker rm -f es-lite-nats
      - NATS_URL=nats://127.0.0.1:4222 go test -count=1 ./examples/snapshots/...

  vet:
    desc: go vet across the module.
    cmds:
      - go vet ./...

  lint:proto:
    desc: buf lint + breaking-change check against main.
    cmds:
      - buf lint
      - buf breaking --against '.git#ref=origin/main'

  buf:push:
    desc: >
      Push the es/v1 options module to the BSR as buf.build/laenenai/es-lite
      (ADR 0033). Needs a BUF_TOKEN with write access (`buf registry login`).
      LABEL defaults to the current git ref name; CI pushes `main` on every
      main build and the tag name on release. Lint + breaking gate the push.
    cmds:
      - buf lint proto
      - buf breaking proto --against '.git#ref=origin/main,subdir=proto'
      - buf push proto --label "{{.LABEL | default "$(git rev-parse --abbrev-ref HEAD)"}}"

  tidy:
    desc: Tidy go.mod/go.sum.
    cmds:
      - go mod tidy

  docker:build:
    desc: >
      Build the es-lited container image. Override VERSION with a semver tag
      (default "dev"). Example: VERSION=v0.3.0 task docker:build.
    cmds:
      - docker build --build-arg VERSION="{{.VERSION | default \"dev\"}}" -t "{{.IMAGE | default \"es-lited:dev\"}}" .

  docker:push:
    desc: >
      Build and push the multi-arch es-lited image. Needs a registry login
      (e.g. `docker login ghcr.io`). Override the tag with IMAGE=... and
      VERSION=..., e.g. IMAGE=ghcr.io/laenenai/es-lited:v0.3.0 VERSION=v0.3.0
      task docker:push. CI publishes on release tags (release.yml) — this is
      for manual/local pushes.
    cmds:
      - docker buildx build --build-arg VERSION="{{.VERSION | default \"dev\"}}" --platform linux/amd64,linux/arm64 --push -t "{{.IMAGE | default \"ghcr.io/laenenai/es-lited:dev\"}}" .
